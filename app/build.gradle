apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(rootProject.file("app/keystore.properties")))

android {
    namespace "com.merware.dayssincepro"
    compileSdk 35


    defaultConfig {
        applicationId "com.MerWare.DaysSincePro"
        minSdk 30
        targetSdk 35
        versionCode 47
        versionName "3.2.0"
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // enables R8
            shrinkResources true        // optional but recommended
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                      'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
   compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'

    // Real SQLite engine for JVM-only tests that exercise actual SQL (VACUUM INTO, etc.)
    // without needing the Android runtime/emulator.
    testImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0' 
}
