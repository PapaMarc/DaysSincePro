apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(rootProject.file("app/keystore.properties")))

android {
    namespace "com.merware.dayssincepro"
    compileSdk 36


    defaultConfig {
        applicationId "com.MerWare.DaysSincePro"
        minSdk 30
        targetSdk 36
        versionCode 52
        versionName "3.15.285.52"
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // enables R8
            shrinkResources true        // optional but recommended
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                      'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        sideload {
            initWith release
            applicationIdSuffix ".dev"
            pseudoLocalesEnabled true
            signingConfig signingConfigs.release
        }
    }

   compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'

    // Real SQLite engine for JVM-only tests that exercise actual SQL (VACUUM INTO, etc.)
    // without needing the Android runtime/emulator.
    testImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.14.0' 
}

tasks.register("checkNoHardcodedUiStrings", Exec) {
    group = "verification"
    description = "Fails if obvious UI sink calls use hardcoded string literals in main source."

    commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            "${rootProject.projectDir}/scripts/check_no_hardcoded_ui_strings.ps1",
            "-RepoRoot", "${rootProject.projectDir}"
}

tasks.register("updateNoHardcodedUiStringsBaseline", Exec) {
    group = "verification"
    description = "Updates baseline for known hardcoded UI string guard violations."

    commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            "${rootProject.projectDir}/scripts/check_no_hardcoded_ui_strings.ps1",
            "-RepoRoot", "${rootProject.projectDir}",
            "-UpdateBaseline"
}

tasks.register("checkReminderLocalizationKeys") {
    group = "verification"
    description = "Fails build if required reminder warning/state localization keys are missing from supported locales."

    doLast {
        def requiredLocales = [
                "values",
                "values-de",
                "values-es",
                "values-fr",
                "values-hi",
                "values-it",
                "values-pt",
                "values-pt-rBR",
                "values-zh-rCN"
        ]

        def requiredKeys = [
                "csv_history_warning_title",
                "csv_history_warning_message",
                "csv_history_warning_continue",
                "csv_history_warning_export_db",
                "lead_days_source_default_from_recurrence",
                "lead_days_source_custom",
                "event_notifications_enabled",
            "event_notifications_disabled",
                "notify_global_disabled_hint",
                "notify_at_time_format"
        ]

        def requiredPlurals = [
            "notify_lead_days_prior_summary"
        ]

        def missing = []
        requiredLocales.each { localeDir ->
            File stringsFile = file("${projectDir}/src/main/res/${localeDir}/strings.xml")
            if (!stringsFile.exists()) {
                missing.add("${localeDir}: missing strings.xml")
                return
            }

            def xmlText = stringsFile.getText("UTF-8")

            requiredKeys.each { key ->
                def keyPattern = ~/(<string\s+name=\"${java.util.regex.Pattern.quote(key)}\")/
                if (!(xmlText =~ keyPattern).find()) {
                    missing.add("${localeDir}: missing key '${key}'")
                }
            }

            requiredPlurals.each { pluralName ->
                def pluralPattern = ~/(<plurals\s+name=\"${java.util.regex.Pattern.quote(pluralName)}\")/
                if (!(xmlText =~ pluralPattern).find()) {
                    missing.add("${localeDir}: missing plural '${pluralName}'")
                }
            }
        }

        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Reminder localization gate failed:\n" + missing.join("\n"))
        }
    }
}

tasks.named("check") {
    dependsOn("checkNoHardcodedUiStrings")
    dependsOn("checkReminderLocalizationKeys")
}

tasks.named("preBuild") {
    dependsOn("checkReminderLocalizationKeys")
}
