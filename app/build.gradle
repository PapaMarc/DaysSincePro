apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(rootProject.file("app/keystore.properties")))

android {
    namespace "com.merware.dayssincepro"
    compileSdk 36


    defaultConfig {
        applicationId "com.MerWare.DaysSincePro"
        minSdk 30
        targetSdk 36
        versionCode 51
        versionName "3.13.214.51"
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // enables R8
            shrinkResources true        // optional but recommended
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                      'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        sideload {
            initWith release
            applicationIdSuffix ".dev"
            signingConfig signingConfigs.release
        }
    }

   compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'

    // Real SQLite engine for JVM-only tests that exercise actual SQL (VACUUM INTO, etc.)
    // without needing the Android runtime/emulator.
    testImplementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.14.0' 
}

tasks.register("checkNoHardcodedUiStrings", Exec) {
    group = "verification"
    description = "Fails if obvious UI sink calls use hardcoded string literals in main source."

    commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            "${rootProject.projectDir}/scripts/check_no_hardcoded_ui_strings.ps1",
            "-RepoRoot", "${rootProject.projectDir}"
}

tasks.register("updateNoHardcodedUiStringsBaseline", Exec) {
    group = "verification"
    description = "Updates baseline for known hardcoded UI string guard violations."

    commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
            "${rootProject.projectDir}/scripts/check_no_hardcoded_ui_strings.ps1",
            "-RepoRoot", "${rootProject.projectDir}",
            "-UpdateBaseline"
}

tasks.named("check") {
    dependsOn("checkNoHardcodedUiStrings")
}
